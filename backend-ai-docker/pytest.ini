[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: Fast deterministic unit tests with in-process mocks
    integration: Live network or subprocess tests requiring open ports or services
filterwarnings =
    ignore::DeprecationWarning

