services:
  mech-chess-ai-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mech-chess-ai-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=3D Mech AR Chess AI Backend
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - mech-chess-network

networks:
  mech-chess-network:
    driver: bridge
