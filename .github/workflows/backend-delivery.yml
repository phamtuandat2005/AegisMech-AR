name: Backend Delivery & Container Registry

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'backend-ai-docker/**'
      - 'Dockerfile'
      - 'render.yaml'
      - '.github/workflows/backend-delivery.yml'
  workflow_dispatch:

concurrency:
  group: backend-delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  preflight-tests:
    name: Pre-Publish Verification Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            backend-ai-docker/requirements.txt
            backend-ai-docker/requirements-dev.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-ai-docker/requirements.txt
          pip install -r backend-ai-docker/requirements-dev.txt

      - name: Run Pytest Suites
        working-directory: backend-ai-docker
        env:
          APP_ENV: test
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          JWT_SECRET_KEY: delivery_preflight_secret_key_minimum_length_32
        run: |
          pytest -v -m "not integration"

  publish-container:
    name: Build & Push Container to GHCR
    needs: [ preflight-tests ]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-ai-docker
          file: ./backend-ai-docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-render:
    name: Notify / Coordinate Render Deployment
    needs: [ publish-container ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    steps:
      - name: Trigger Render Deploy Hook (if configured)
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            echo "Triggering Render deployment webhook..."
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$DEPLOY_HOOK_URL")
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
              echo "SUCCESS: Render deploy hook triggered successfully (HTTP $HTTP_STATUS)."
            else
              echo "WARNING: Render deploy hook responded with HTTP $HTTP_STATUS."
            fi
          else
            echo "=========================================================================="
            echo "INFO: RENDER_DEPLOY_HOOK_URL secret is not set."
            echo "Render service is configured with autoDeploy: true in render.yaml,"
            echo "so Render natively deploys changes pushed to the 'main' branch."
            echo "No duplicate webhook trigger was fired."
            echo "=========================================================================="
          fi
