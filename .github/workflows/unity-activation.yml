name: Unity Activation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-activation-file:
    name: Acquire Unity Activation File (.alf)
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        id: step_one
        with:
          unityVersion: 6000.3.20f1

      - name: Expose activation file (.alf) artifact
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.3.20f1.alf
          path: ${{ steps.step_one.outputs.filePath }}
